<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bonos Empresa</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="loginView" class="login">
      <section class="login-panel">
        <p class="eyebrow">Verduleria</p>
        <h1>Bonos Empresa</h1>
        <form id="loginForm" class="stack">
          <label>PIN de acceso<input name="pin" type="password" value="1234" required></label>
          <button type="submit">Ingresar</button>
          <small id="loginError"></small>
        </form>
      </section>
    </main>

    <main id="appView" class="app hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">Control mensual</p>
          <h1>Bonos Empresa</h1>
        </div>
        <div class="toolbar">
          <label>Mes<input id="periodo" type="month"></label>
          <button id="refreshBtn" class="secondary">Actualizar</button>
          <button id="logoutBtn" class="secondary">Salir</button>
        </div>
      </header>

      <section class="metrics">
        <article><span>Empleados activos</span><strong id="statActivos">0</strong></article>
        <article><span>Bonos usados</span><strong id="statUsados">0</strong></article>
        <article><span>Pendientes</span><strong id="statPendientes">0</strong></article>
        <article><span>Total a cobrar</span><strong id="statTotal">$ 0</strong></article>
      </section>

      <section class="layout">
        <section class="panel">
          <h2>Buscar y marcar</h2>
          <div class="filters">
            <input id="buscar" type="search" placeholder="Nombre, DNI o legajo">
            <button id="soloPendientes" class="secondary">Pendientes</button>
            <button id="verTodos" class="secondary">Todos</button>
            <button id="exportar" class="secondary">Exportar CSV</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Empleado</th>
                  <th>DNI</th>
                  <th>Legajo</th>
                  <th>Estado</th>
                  <th>Accion</th>
                </tr>
              </thead>
              <tbody id="tabla"></tbody>
            </table>
          </div>
        </section>

        <aside class="side">
          <form id="configForm" class="panel form-grid">
            <h2>Empresa y monto</h2>
            <label>Empresa<input id="empresa" name="empresa" required></label>
            <label>Monto mensual<input id="monto" name="montoMensual" type="number" min="0" step="100" required></label>
            <button type="submit">Guardar configuracion</button>
          </form>

          <form id="empleadoForm" class="panel form-grid">
            <h2>Nuevo empleado</h2>
            <label>Nombre y apellido<input name="nombre" required></label>
            <label>DNI<input name="dni" required></label>
            <label>Legajo<input name="legajo"></label>
            <button type="submit">Agregar empleado</button>
          </form>

          <form id="importForm" class="panel form-grid">
            <h2>Importar empleados</h2>
            <label class="wide">Lista CSV<textarea id="csv" placeholder="Juan Perez,30111222,A15&#10;Ana Gomez,28999888,A16"></textarea></label>
            <button type="submit">Importar lista</button>
          </form>
        </aside>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
